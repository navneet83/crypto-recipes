name: vectors
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m venv .venv && .venv/bin/pip install cryptography
      - run: .venv/bin/python impl/python/harness.py
      - run: node impl/typescript/harness.mjs
      - run: swift impl/swift/pbe_record_pbkdf2_gcm_v1.swift
      - run: sh tools/crosscheck.sh
