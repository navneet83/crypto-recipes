name: vectors
on:
  push:
  pull_request:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 -m venv .venv && .venv/bin/pip install cryptography
      - run: sh tools/crosscheck.sh
  # Linux has no CryptoKit, so Swift is left out here. .NET's post-quantum classes are only enabled on
  # Linux and Windows, which is why this job exists at all.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: python3 -m venv .venv && .venv/bin/pip install cryptography
      - run: .venv/bin/python tools/xaes_c2sp_check.py && .venv/bin/python tools/argon2_rfc9106_check.py
      - run: LANGS="typescript python go java csharp" sh tools/crosscheck.sh
  # .NET enables ML-DSA only where the OS has it: OpenSSL 3.5+ on Linux. ubuntu-latest ships OpenSSL 3.0, so the C#
  # post-quantum file runs here, in the .NET 10 SDK image (Debian 13, OpenSSL 3.5), against the committed vectors.
  dotnet-pq:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - run: openssl version
      - run: dotnet run --project impl/csharp -- --list
      - run: dotnet run --project impl/csharp -- --list | grep -qx sign-detached-pq-v1
      - run: dotnet run --project impl/csharp
        env:
          RECIPES_ROOT: ${{ github.workspace }}
